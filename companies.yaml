# Watchlist of companies whose job boards fetch_jobs.py checks directly.
#
# How to find a company's ats and token:
#   Open the company's careers page and click any job. Look at the URL:
#     boards.greenhouse.io/<token>/...  or  job-boards.greenhouse.io/<token>/...  -> ats: greenhouse
#     jobs.lever.co/<token>/...                                                  -> ats: lever
#     jobs.ashbyhq.com/<token>/...                                               -> ats: ashby
#   If the URL is something else (Workday, Rippling, Workable, Paylocity, the
#   company's own site), that company can't go here; use its email job alerts
#   instead, and Adzuna may still catch its postings.

